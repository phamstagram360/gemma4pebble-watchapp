name: Build Watch App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build inside Debian Buster container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            python:2.7.18-buster bash -c "
              set -e

              sed -i 's/deb.debian.org/archive.debian.org/g' /etc/apt/sources.list
              sed -i 's/security.debian.org/archive.debian.org/g' /etc/apt/sources.list
              sed -i '/buster-updates/d' /etc/apt/sources.list
              apt-get update -qq
              apt-get install -qq -y libsdl1.2debian libfdt1 libpixman-1-0 libfreetype6 libx11-6 rlwrap wget

              pip install -q virtualenv

              mkdir -p /tmp/sdk
              curl -fL 'https://developer.rebble.io/s3.amazonaws.com/assets.getpebble.com/pebble-tool/pebble-sdk-4.5-linux64.tar.bz2' \
                | tar xj --strip-components=1 -C /tmp/sdk

              cd /tmp/sdk && virtualenv .env && .env/bin/pip install -q -r requirements.txt

              wget -q 'https://github.com/aveao/PebbleArchive/raw/master/SDKCores/sdk-core-4.3.tar.bz2' \
                -O /tmp/sdk-core.tar.bz2
              mkdir -p /root/.pebble-sdk && touch /root/.pebble-sdk/NO_TRACKING
              /tmp/sdk/bin/pebble sdk install /tmp/sdk-core.tar.bz2

              cd /app && yes | /tmp/sdk/bin/pebble build
            "

      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: AI-Assistant-for-Pebble
          path: build/app.pbw
          retention-days: 90
